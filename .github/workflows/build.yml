name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  API_LEVEL: "28"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run host unit tests
        run: cargo test

  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { triple: aarch64-linux-android,  abi: arm64-v8a,   clang: aarch64-linux-android }
          - { triple: armv7-linux-androideabi, abi: armeabi-v7a, clang: armv7a-linux-androideabi }
          - { triple: x86_64-linux-android,   abi: x86_64,      clang: x86_64-linux-android }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Resolve Android NDK path
        run: |
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-$ANDROID_HOME/ndk-bundle}}"
          if [ -z "$NDK" ]; then
            NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "NDK=$NDK" >> "$GITHUB_ENV"

      - name: Build libntsync_android.so
        run: |
          export "CARGO_TARGET_$(echo ${{ matrix.target }} | tr 'a-z-' 'A-Z_')_LINKER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.clang }}${{ env.API_LEVEL }}-clang"
          export AR="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          cargo build --release --target ${{ matrix.target }}

      - name: Verify 16KB page-size alignment
        run: |
          SO=target/${{ matrix.target }}/release/libntsync_android.so
          readelf -lW "$SO" | grep LOAD
          readelf -lW "$SO" | grep LOAD | awk '{print $NF}' | grep -qx 0x4000

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libntsync_android-${{ matrix.abi }}
          path: |
            target/${{ matrix.target }}/release/libntsync_android.so
            include/ntsync_user.h
